plc:
  ip_address: 192.168.188.20
  port: 502
  start_register: 0
  num_registers: 3
  poll_rate_hz: 20.0
  response_timeout_ms: 200
  reconnect_delay_ms: 1000
  diagnostics_topic: /diagnostics/plc_modbus
  left_track_register_index: 0
  right_track_register_index: 1
  status_register_index: 2
  track_speed_scale: 0.001
  cutting_on_bit: 0
  valid_bit: 1
