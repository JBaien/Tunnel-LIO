left_track_speed_topic: /plc/left_track_speed
right_track_speed_topic: /plc/right_track_speed
cutting_on_topic: /plc/cutting_on
odom_topic: /lio/odom_local
relocalizing_topic: /session/relocalizing
state_topic: /machine/state
diagnostics_topic: /diagnostics/machine_state

publish_period_sec: 0.1
static_track_threshold: 0.05
move_track_threshold: 0.1
static_lidar_speed_threshold: 0.03
move_lidar_speed_threshold: 0.08
turn_track_delta_threshold: 0.12
